name: Running Nodejs App
on:
 workflow_dispatch

jobs:
  running-node-js:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout the code
       uses: actions/checkout@v6

     - name: Install node -js
       uses: actions/checkout@v4
        with:
          node-version: 20  
     - name: run the app
       run: npm start &

     - name: Wait for the app to boot
       run: sleep 5

     - name: Check health 
       run: curl -I "http://localhost:3000/health" || exit 1  


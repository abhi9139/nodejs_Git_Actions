name: outputs
on:
    push
jobs:
    job1:
        runs-on: ubuntu-latest
        outputs:
            job1_output: ${{steps.step2.outputs.msg}}
        steps:
        - name: Set a variable
          id: step1
          run: echo "msg=this is text" >> $GITHUBOUTPUT
        - name: get a variable
          run: echo "The output from step1 is ==> ${{steps.step1.outputs.msg}}"
        - name: Set second variable
          id: step2
          run: echo "msg=this is step2" >> $GITHUBOUTPUT
    job2:
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: get the data from job1
              run: echo "The data from job1 is ==> ${{needs.job1.outputs.job1_output}}"
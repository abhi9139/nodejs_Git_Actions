name: outputs
on:
    workflow_dispatch
jobs:
    job1:
        runs-on: ubuntu-latest
        steps:
            - name: set a variable
              id: step1
              run: echo "msg=It is from Step1" >> $GITHUB_OUTPUT
            - name: get a variable
              id: step2
              run: echo "The output from Step1" is ${{steps.step1.outputs.msg}}